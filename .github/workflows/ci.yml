# CI for cinematic-pointer (PUBLIC repository).
#
# Runner selection, identical on every job: the organisation's self-hosted pool only when it is
# bootstrapped AND the run is not a pull request from a fork. A fork pull request always runs on
# GitHub-hosted runners, whatever the repository variable says, so outside code never reaches the
# self-hosted pool.
#
# Supply chain: every action is pinned to a full commit SHA (tag in the comment), installs come from the
# committed lockfile (`npm ci`), top-level permissions are read-only, no job receives a secret.
#
# Read-proof, fail-closed: every lane prints what it checked and fails on an empty read.
#
# Not here: the Playwright end-to-end suite and any real recording or FFmpeg render. The runners carry no
# browsers and no FFmpeg; those are local checks whose summary goes in the pull request (AGENTS.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-docs:
    name: Agent docs and boundary markers
    runs-on: ${{ (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'madfam-runners-blue' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required files and markers
        run: |
          set -euo pipefail
          n=0
          for f in AGENTS.md CLAUDE.md llms.txt llms-full.txt LICENSE NOTICE docs/REPO_BOUNDARY.md package-lock.json; do
            test -s "$f" || { echo "missing or empty $f"; exit 1; }
            n=$((n + 1))
          done
          grep -q '<!-- MADFAM-AGENTS-CANONICAL v1 -->' AGENTS.md
          head -c 2000 AGENTS.md | grep -Eq '^>[[:space:]]*Last Updated:[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$'
          grep -q 'docs/REPO_BOUNDARY.md' AGENTS.md
          grep -qi 'canonical agent instructions' CLAUDE.md
          grep -q 'AGENTS.md' CLAUDE.md
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -q '"license": "AGPL-3.0-only"' package.json
          echo "agent-docs: files=$n markers=7 OK"

  quality:
    name: Typecheck, lint, format and unit tests
    runs-on: ${{ (vars.ARC_BOOTSTRAP_COMPLETE == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'madfam-runners-blue' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      # The browsers are never used by the unit lane; skipping the download keeps the install small.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Trailer catalog matches the product list
        run: npm run catalog:check
      - name: Unit tests
        run: |
          set -euo pipefail
          npx jest --ci --maxWorkers=2 --json --outputFile=jest-results.json
          node -e '
            const r = require("./jest-results.json");
            if (!r.numTotalTests) { console.error("unit: read nothing (0 tests)"); process.exit(1); }
            console.log(`unit: suites=${r.numTotalTestSuites} tests=${r.numTotalTests} passed=${r.numPassedTests} failed=${r.numFailedTests}`);
            process.exit(r.success ? 0 : 1);
          '
      - name: Build
        run: |
          set -euo pipefail
          npm run build
          test -s dist/cli.js
          echo "build: dist/cli.js present OK"
