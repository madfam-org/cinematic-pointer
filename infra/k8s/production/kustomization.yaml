# Production kustomize base for the Cinematic Pointer landing (Enclii project cinematic-pointer,
# namespace cinematic-pointer). Image digest: pinned by the Landing workflow (Enclii's reusable
# build-publish), which commits the digest here. The all-zero digest is a PLACEHOLDER the first
# successful build overwrites; it never resolves, so nothing can run an unpinned image before then.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinematic-pointer
resources:
- deployment.yaml
- service.yaml
- service-metrics.yaml
- poddisruptionbudget.yaml
- network-policy.yaml
images:
- digest: sha256:44a6954bef8d4f1f6300d286abe73f89f3d778f719562a25fac35dbb7f30a960
  name: ghcr.io/madfam-org/cinematic-pointer-landing
  newName: ghcr.io/madfam-org/cinematic-pointer-landing
